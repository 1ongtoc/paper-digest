name: Daily Paper Digest

on:
  schedule:
    # GitHub cron uses UTC: 02:17 UTC = 10:17 Asia/Shanghai.
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, filter, summarize, and email
        id: digest
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/main.py

      - name: Commit delivered state and website data
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ feed.xml config.js
          if git diff --cached --quiet; then
            echo "No delivered-state changes to commit"
          else
            git commit -m "Update paper digest $(date -u +'%Y-%m-%d')"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push attempt $attempt failed; rebasing and retrying"
              git pull --rebase
              sleep $((attempt * 5))
            done
            echo "Email was accepted but delivered state could not be pushed. Rerun only after inspecting the repository state."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js feed.xml .nojekyll _site/
          cp -r data _site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
