<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全推理论文脉搏</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="alternate" type="application/rss+xml" title="Paper Pulse RSS Feed" href="feed.xml">
</head>
<body>
    <h1>安全推理论文脉搏</h1>
    <p class="subtitle">IACR ePrint 全量元数据 + arXiv 宽召回元数据翻译｜相关论文摘要导读｜安全推理论文全文精选｜<a href="feed.xml">RSS</a></p>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索标题、作者、主题或摘要……">
        </div>

        <div class="filters">
            <select id="sourceFilter">
                <option value="all">全部来源</option>
                <option value="arXiv">arXiv</option>
                <option value="IACR">IACR</option>
            </select>

            <select id="sortBy">
                <option value="date-desc">最新优先</option>
                <option value="date-asc">最早优先</option>
                <option value="title">标题 A–Z</option>
            </select>

            <button id="exportAllBtn" class="export-btn">导出当前结果为 BibTeX</button>
        </div>
    </div>

    <div id="stats" class="stats"></div>

    <div id="papersList" class="papers-list">
        <div class="loading">正在加载论文……</div>
    </div>

    <div id="pagination"></div>

    <footer>
        <p>最后更新：<span id="lastUpdated">-</span></p>
        <p>每天 10:17（Asia/Shanghai）由 GitHub Actions 自动更新｜基于 <a href="https://github.com/Jamie-Cui/paper-pulse">Paper Pulse</a> 修改</p>
    </footer>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
